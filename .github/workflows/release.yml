name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    uses: castrowithcee/qatlas-kit/.github/workflows/release.yml@44f3d6ee35ac2fac84e6c477f4d5c7fcce3e7327 # v0.5.0
    permissions:
      contents: write
    with:
      program: qdeploy
      namespace: qdeploy-release
      environment: release
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
