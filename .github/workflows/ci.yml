name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        run: sudo apt-get update -q && sudo apt-get install -y -q just
      - name: Dependencies
        run: go mod download
      - name: Test
        env:
          TEST_SLOTS: "1"
          TEST_JOBS: "4"
          TEST_CPU: "400%"
          TEST_MEM: "8G"
          TEST_TIMEOUT: "15m"
        run: just test
      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
